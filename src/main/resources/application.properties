# =====================================================================
# Billing Service — orçamento e pagamento (Mercado Pago)
# ---------------------------------------------------------------------
# Perfis: %dev (mvn quarkus:dev) e %test usam Dev Services — o Quarkus
# sobe PostgreSQL e RabbitMQ em containers sozinho. %prod (imagem Docker,
# docker-compose, EKS) recebe tudo por variável de ambiente.
# =====================================================================
quarkus.application.name=oficina-billing-service
quarkus.http.port=8080
oficina.ambiente=${AMBIENTE:local}

# ===== Banco próprio (DynamoDB — ADR 009) =====
# Sem Dev Services: o do Quarkus usa LocalStack, que passou a exigir token de conta.
# Local e testes usam o DynamoDB Local oficial da AWS (amazon/dynamodb-local):
#   - mvn quarkus:dev → docker compose up dynamodb (porta 8000)
#   - testes          → container próprio (DynamoDbLocalResource)
# Em %prod (EKS) as credenciais vêm da role do nó (LabRole), sem endpoint override.
quarkus.dynamodb.sync-client.type=url
quarkus.dynamodb.devservices.enabled=false
quarkus.dynamodb.aws.region=${AWS_REGION:us-east-1}
%prod.quarkus.dynamodb.aws.credentials.type=default
%dev.quarkus.dynamodb.endpoint-override=http://localhost:8000
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=local
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=local
oficina.billing.tabela=${DYNAMODB_TABELA:oficina-billing-local}
# Local e testes criam a tabela na subida; na AWS quem cria é o Terraform.
oficina.billing.criar-tabela=${DYNAMODB_CRIAR_TABELA:false}
%dev.oficina.billing.criar-tabela=true
%test.oficina.billing.criar-tabela=true

# ===== RabbitMQ (contratos em docs/fase-4/contratos-mensagens.md) =====
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.3-management-alpine
%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USER:guest}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Entrada: comandos do orquestrador (exchange direct, routing key = "billing"). Fila quorum + DLQ.
mp.messaging.incoming.comandos.connector=smallrye-rabbitmq
mp.messaging.incoming.comandos.queue.name=billing.comandos
mp.messaging.incoming.comandos.queue.x-queue-type=quorum
mp.messaging.incoming.comandos.exchange.name=oficina.comandos
mp.messaging.incoming.comandos.exchange.type=direct
mp.messaging.incoming.comandos.routing-keys=billing
mp.messaging.incoming.comandos.auto-bind-dlq=true
mp.messaging.incoming.comandos.dlx.declare=true
mp.messaging.incoming.comandos.dead-letter-exchange=oficina.dlx
mp.messaging.incoming.comandos.dead-letter-queue-name=billing.comandos.dlq
mp.messaging.incoming.comandos.dead-letter-routing-key=billing.comandos

# Saída: eventos (exchange topic, routing key "billing.<evento>").
mp.messaging.outgoing.eventos.connector=smallrye-rabbitmq
mp.messaging.outgoing.eventos.exchange.name=oficina.eventos
mp.messaging.outgoing.eventos.exchange.type=topic
mp.messaging.outgoing.eventos.exchange.declare=true
# Publisher confirms: o relay só apaga o evento do outbox depois da confirmação do broker.
mp.messaging.outgoing.eventos.publish-confirms=true

# ===== Pagamento (RFC 004) =====
# simulado (padrão): sem credenciais — checkout em /simulador. mercadopago: exige MP_ACCESS_TOKEN.
oficina.pagamento.provedor=${PAGAMENTO_PROVEDOR:simulado}
oficina.pagamento.validade=${PAGAMENTO_VALIDADE:PT30M}
oficina.pagamento.verificacao=15s
oficina.pagamento.tentativas-estorno=3
oficina.pagamento.simulador.url-base=${SIMULADOR_URL_BASE:http://localhost:8082}
oficina.mercadopago.base-url=${MP_BASE_URL:https://api.mercadopago.com}
oficina.mercadopago.access-token=${MP_ACCESS_TOKEN:}
oficina.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
oficina.mercadopago.notification-url=${MP_NOTIFICATION_URL:}
oficina.mercadopago.url-retorno=${MP_URL_RETORNO:}
oficina.mercadopago.link-sandbox=${MP_LINK_SANDBOX:true}

# ===== Outbox e consumidor =====
oficina.outbox.intervalo=1s
oficina.mensageria.tentativas=3
oficina.mensageria.backoff-ms=200
%test.oficina.outbox.intervalo=0.2s
%test.oficina.outbox.atraso-inicial=0s
%test.oficina.mensageria.backoff-ms=10
%test.oficina.pagamento.verificacao=0.5s
%test.oficina.pagamento.atraso-inicial=0s
%test.oficina.mercadopago.webhook-secret=segredo-de-teste

# ===== Segurança (JWT RS256 — só VALIDA; quem emite é o OS Service ou a Lambda) =====
# A chave pública em resources/ é SÓ de desenvolvimento e teste. Em Kubernetes a real
# chega por Secret e esta propriedade é sobrescrita por env (MP_JWT_VERIFY_PUBLICKEY_LOCATION).
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=oficina-mvp
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# ===== OpenAPI / Swagger =====
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Oficina — Billing Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Orçamento e pagamento via Mercado Pago (fase 4).
quarkus.smallrye-openapi.security-scheme=jwt

# ===== Observabilidade (reaproveitada da fase 3) =====
quarkus.otel.resource.attributes=service.namespace=oficina,deployment.environment=${AMBIENTE:local}
# Em %prod o SDK só liga quando há destino (New Relic ou Jaeger local):
#   OTEL_SDK_DISABLED=false + OTLP_ENDPOINT (+ NEW_RELIC_LICENSE_KEY no New Relic)
%prod.quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
%prod.quarkus.otel.exporter.otlp.protocol=http/protobuf
%prod.quarkus.otel.exporter.otlp.endpoint=${OTLP_ENDPOINT:https://otlp.nr-data.net:4318}
%prod.quarkus.otel.exporter.otlp.headers=api-key=${NEW_RELIC_LICENSE_KEY:}
# Em dev/test os spans existem (traceId nos logs), mas nada sai da máquina.
%dev.quarkus.otel.traces.exporter=none
%test.quarkus.otel.traces.exporter=none

# Logs JSON com traceId/spanId onde algo coleta (prod); legíveis em dev.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.additional-field."service.name".value=oficina-billing-service

quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true

%dev.quarkus.log.category."br.com.fiap.techchallenge".level=DEBUG

# ===== Cobertura (quarkus-jacoco, só em teste) =====
# Acrescenta ao arquivo dos testes de unidade em vez de apagá-lo; o relatório e o
# gate de 80% são do jacoco-maven-plugin (target/site/jacoco), lidos pelo CI e Sonar.
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
